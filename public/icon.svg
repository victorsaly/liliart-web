<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- A pot of brushes, after the original app's icon but drawn here rather
       than borrowed: that one was a watermarked stock illustration. Same idea,
       same magenta, ours to ship. -->
  <rect width="64" height="64" rx="14" fill="#fff"/>

  <!-- pencil -->
  <g transform="rotate(-16 24 34)">
    <rect x="20" y="17" width="5" height="21" fill="#f5a623"/>
    <rect x="20" y="17" width="5" height="4" fill="#e08a00"/>
    <path d="M20 38h5l-2.5 5z" fill="#f0d9b5"/>
    <path d="M21.6 41.2h1.8l-0.9 1.8z" fill="#3b2a20"/>
  </g>

  <!-- tall brush, magenta handle -->
  <g transform="rotate(-6 31 32)">
    <rect x="28.5" y="14" width="5" height="24" rx="1" fill="#B00B80"/>
    <rect x="28.2" y="11" width="5.6" height="4" rx="1" fill="#9aa0a6"/>
    <path d="M31 4c2 3 2.6 5 2.6 7h-5.2C28.4 9 29 7 31 4z" fill="#3b2a20"/>
  </g>

  <!-- flat brush, pink handle -->
  <g transform="rotate(9 40 33)">
    <rect x="37.5" y="16" width="5" height="22" rx="1" fill="#DD4F97"/>
    <rect x="37.2" y="12.5" width="5.6" height="4" rx="1" fill="#9aa0a6"/>
    <rect x="37.4" y="7" width="5.2" height="6" rx="1.2" fill="#5b4438"/>
  </g>

  <!-- the pot -->
  <path d="M19 36h26l-3.2 18.5a3 3 0 0 1-3 2.5H25.2a3 3 0 0 1-3-2.5z" fill="#DD4F97"/>
  <path d="M19 36h26l-.7 4H19.7z" fill="#B00B80"/>
  <path d="M38.6 39.5h3.1l-2.4 14a1.6 1.6 0 0 1-1.6 1.4h-1.4z" fill="#fff" opacity=".28"/>
</svg>
